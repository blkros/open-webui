services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      HF_HOME: "/cache/hf"
      TRANSFORMERS_CACHE: "/cache/hf/transformers"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      MCP_CONFLUENCE_URL: "http://mcp-confluence:9000/sse"

    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - RAG_PROXY_URL=http://rag-proxy:8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - BYPASS_EMBEDDING_AND_RETRIEVAL=false
      - WEBUI_SECRET_KEY=
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    depends_on:
      - rag-proxy
      - ollama
    volumes:
      - open-webui:/app/backend/data
      - /opt/open-webui/backend/open_webui:/app/backend/open_webui:ro   # ← 절대경로로 고정
    ports:
      - "3000:8080"
    networks: [opt_ai-net]
    restart: unless-stopped
  
  mcp-confluence:
    build:
      context: /opt/mcp-confluence
    container_name: mcp-confluence
    env_file:
      - /opt/mcp-confluence/.env
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      - TRANSPORT=sse
    # 디버깅 외에는 굳이 열 필요 없음(내부 통신이면 불필요)
    # ports:
    #   - "9000:9000"


volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net