services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      HF_HOME: "/cache/hf"
      TRANSFORMERS_CACHE: "/cache/hf/transformers"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      MCP_CONFLUENCE_URL: "http://mcp-atlassian:9000/mcp"

    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - RAG_PROXY_URL=http://rag-proxy:8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - BYPASS_EMBEDDING_AND_RETRIEVAL=false
      - WEBUI_SECRET_KEY=
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    depends_on:
      - rag-proxy
      - ollama
    volumes:
      - open-webui:/app/backend/data
      - /opt/open-webui/backend/open_webui:/app/backend/open_webui:ro   # ← 절대경로로 고정
    ports:
      - "3000:8080"
    networks: [opt_ai-net]
    restart: unless-stopped
  
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    restart: unless-stopped
    env_file:
      - /opt/mcp-atlassian/.env
    command: ["--transport","streamable-http","--port","9000","-vv"]
    networks: [opt_ai-net]
    # 외부 테스트 끝나면 ports 지워도 됨. 잠깐 테스트 필요하면 아래 주석 해제
    # ports: ["127.0.0.1:9000:9000"]


volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net