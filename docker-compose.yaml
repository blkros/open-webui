services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      MCP_URL: "http://mcp-confluence:9000/sse?version=2025-06-18"
      MCP_PROTOCOL_VERSION: "2025-06-18"
      DISABLE_INTERNAL_MCP: "1"
      INDEX_DIR: faiss_index
      UPLOAD_DIR: uploads
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf/transformers
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
      ENABLE_RERANKER: "true"
      RERANKER_MODEL: BAAI/bge-reranker-base
      ENABLE_SPARSE: "1"
      SPARSE_LIMIT: "200"
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "120"
      RETRIEVER_K: "3"
      RERANKER_TOP_N: "3"
      RETRIEVER_FETCH_K: "40"
    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    # 공식 이미지 대신, 내 소스로 빌드해서 씀
    build:
      context: /opt/open-webui
      dockerfile: Dockerfile
    container_name: open-webui
    environment:
      - ENABLE_RAG_PROXY=true
      - RAG_PROXY_URL=http://rag-proxy:8080
      - BYPASS_EMBEDDING_AND_RETRIEVAL=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - WEBUI_SECRET_KEY=
    depends_on:
      - rag-proxy
      - ollama
    ports: ["3000:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    volumes:
      # 데이터베이스/설정만 볼륨. (코드 바인드 절대 X)
      - type: volume
        source: open-webui
        target: /app/backend/data
      - ./open-webui/backend:/app/backend
      
  mcp-confluence:
    build:
      context: /opt/mcp-confluence
    container_name: mcp-confluence
    env_file:
      - /opt/mcp-confluence/.env
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=9000
      - RAG_PROXY=http://rag-proxy:8080
      - MCP_BASE=http://127.0.0.1:9001
      - TOP_K=4
      - THRESH=0.65
      - CONF_DEFAULT_SPACE=SMST
      - FASTMCP_PORT=9000
    networks: [opt_ai-net]
    restart: unless-stopped
    command: >
      sh -lc "
      uvicorn app.http_wrapper:api --host 0.0.0.0 --port 9001 &
      uvicorn app.bridge_mcp:app --host 0.0.0.0 --port 9012 &
      python -m app.main
      "

volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net