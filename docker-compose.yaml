services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      HF_HOME: "/cache/hf"
      TRANSFORMERS_CACHE: "/cache/hf/transformers"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      # MCP_URL: "http://mcp-confluence:9000/sse"
      # MCP_CONFLUENCE_URL: "http://mcp-confluence:9000/sse"
      # CONFLUENCE_MCP_TOOL: "search_pages"
      DISABLE_INTERNAL_MCP: "1" 
    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - RAG_PROXY_URL=http://rag-proxy:8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - BYPASS_EMBEDDING_AND_RETRIEVAL=false
      - WEBUI_SECRET_KEY=
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    depends_on:
      - rag-proxy
      - ollama
    volumes:
      - open-webui:/app/backend/data
      - /opt/open-webui/backend/open_webui:/app/backend/open_webui:ro   # ← 절대경로로 고정
    ports:
      - "3000:8080"
    networks: [opt_ai-net]
    restart: unless-stopped
  
  mcp-confluence:
    build:
      context: /opt/mcp-confluence
    container_name: mcp-confluence
    env_file:
      - /opt/mcp-confluence/.env
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=9000
      # bridge_mcp가 내부에서 쓸 값
      - RAG_PROXY=http://rag-proxy:8080
      - MCP_BASE=http://127.0.0.1:9001
      - TOP_K=5
      - THRESH=0.83
      - CONFLUENCE_BASE_URL=https://confluence.nuriflex.co.kr
      - CONFLUENCE_USER=새아이디
      - CONFLUENCE_PASSWORD='새비밀번호!특수문자OK'
      - VERIFY_SSL=true
    networks: [opt_ai-net]
    restart: unless-stopped
    # (필요시 외부 접근용) 포트 열고 싶으면 아래 주석 해제
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    #   - "9012:9012"
    command: >
      sh -lc "
      uvicorn app.http_wrapper:api --host 0.0.0.0 --port 9001 &
      uvicorn app.bridge_mcp:app --host 0.0.0.0 --port 9012 &
      python -m app.main
      "

volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net