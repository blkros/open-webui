services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      MCP_URL: "http://mcp-confluence:9000/sse?version=2025-06-18"
      MCP_PROTOCOL_VERSION: "2025-06-18"
      DISABLE_INTERNAL_MCP: "1"
      INDEX_DIR: faiss_index
      UPLOAD_DIR: uploads
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf/transformers
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
      ENABLE_RERANKER: "true"
      RERANKER_MODEL: BAAI/bge-reranker-base
      RERANKER_TOP_N: "5"
      ENABLE_SPARSE: "1"
      SPARSE_LIMIT: "200"
    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.30
    container_name: open-webui
    environment:
      - ENABLE_RAG_PROXY=true
      - RAG_PROXY_URL=http://rag-proxy:8080
      # 내부 임베딩/리트리벌을 건너뛰고 외부 RAG 프록시만 쓰려면 true
      - BYPASS_EMBEDDING_AND_RETRIEVAL=true
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - WEBUI_SECRET_KEY=
    depends_on:
      - rag-proxy
      - ollama
    ports: ["3000:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    volumes:
      # 데이터베이스/설정은 named volume
      - type: volume
        source: open-webui
        target: /app/backend/data
      # 우리가 고친 백엔드 코드 주입 (bind)
      - type: bind
        source: /opt/open-webui/backend/open_webui
        target: /app/backend/open_webui
        bind:
          create_host_path: true


  
  mcp-confluence:
    build:
      context: /opt/mcp-confluence
    container_name: mcp-confluence
    env_file:
      - /opt/mcp-confluence/.env
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=9000
      # bridge_mcp가 내부에서 쓸 값
      - RAG_PROXY=http://rag-proxy:8080
      - MCP_BASE=http://127.0.0.1:9001
      - TOP_K=10
      - THRESH=0.35
      - CONF_DEFAULT_SPACE=SMST
      - FASTMCP_PORT=9000    # FastMCP가 이 포트로 SSE를 띄우도록 강제

    networks: [opt_ai-net]
    restart: unless-stopped
    # (필요시 외부 접근용) 포트 열고 싶으면 아래 주석 해제
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    #   - "9012:9012"
    command: >
      sh -lc "
      uvicorn app.http_wrapper:api --host 0.0.0.0 --port 9001 &
      uvicorn app.bridge_mcp:app --host 0.0.0.0 --port 9012 &
      python -m app.main
      "

volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net