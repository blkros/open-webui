services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: ./RAG
    ports: ["8080:8080"]
    networks: [ai-net]
    restart: unless-stopped
    environment:
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
    env_file:
      - ./RAG/.env

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - RAG_PROXY_URL=http://rag-proxy:8080
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=
    depends_on:
      - rag-proxy
      - ollama
    volumes:
      - open-webui:/app/backend/data
      - /opt/open-webui/backend/open_webui:/app/backend/open_webui:ro   # ← 절대경로로 고정
    ports:
      - "3000:8080"
    networks: [ai-net]
    restart: unless-stopped


volumes:
  ollama: {}
  open-webui: {}

networks:
  ai-net: {}