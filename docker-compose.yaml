services:
  rag-proxy:
    container_name: rag-proxy
    build:
      context: /opt/rag-proxy
      network: host
    ports: ["8080:8080"]
    networks: [opt_ai-net]
    restart: unless-stopped
    environment:
      MCP_URL: "http://mcp-confluence:9000/sse?version=2025-06-18"
      MCP_PROTOCOL_VERSION: "2025-06-18"
      DISABLE_INTERNAL_MCP: "0"
      INDEX_DIR: faiss_index
      UPLOAD_DIR: uploads
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf/transformers
      BRIDGE_MCP: "http://mcp-confluence:9012"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      OPENAI_BASE_URL: "http://172.16.10.168:9993/v1"
      OPENAI_API_KEY: "local-anything"
      EMBEDDING_MODEL: intfloat/multilingual-e5-large-instruct
      EMBEDDING_DEVICE: cpu
      ENABLE_RERANKER: "true"
      RERANKER_MODEL: BAAI/bge-reranker-base
      RERANKER_TOP_N: "5"
    env_file:
      - /opt/rag-proxy/.env
    volumes:
      - hf-cache:/cache/hf
      - /opt/rag-proxy/storage/uploads:/app/uploads
      - /opt/rag-proxy/storage/index:/app/faiss_index

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: never
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [opt_ai-net]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - RAG_PROXY=http://rag-proxy:8080
      - RAG_PROXY_URL=http://rag-proxy:8080
      - RAG_PROXY_TIMEOUT=45
      - RAG_MIN_SCORE=0.24
      - RAG_MAX_CONTEXT_CHARS=8000
      - RAG_TOP_K=5
      - OLLAMA_BASE_URL=http://ollama:11434
      - BYPASS_EMBEDDING_AND_RETRIEVAL=false
      - WEBUI_SECRET_KEY=
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
    depends_on:
      - rag-proxy
      - ollama
    volumes:
      - open-webui:/app/backend/data
      - /opt/open-webui/backend/open_webui:/app/backend/open_webui
    ports:
      - "3000:8080"
    networks: [opt_ai-net]
    restart: unless-stopped
  
  mcp-confluence:
    build:
      context: /opt/mcp-confluence
    container_name: mcp-confluence
    env_file:
      - /opt/mcp-confluence/.env
    environment:
      - TRANSPORT=sse
      - HOST=0.0.0.0
      - PORT=9000
      - OCR_ENABLED=true
      - OCR_LANG=kor+eng
      - OCR_MAX_PAGES=10
      # bridge_mcp가 내부에서 쓸 값
      - RAG_PROXY=http://rag-proxy:8080
      - MCP_BASE=http://127.0.0.1:9001
      - TOP_K=5
      - THRESH=0.83
      - CONF_DEFAULT_SPACE=ENG
      - FASTMCP_PORT=9000    # FastMCP가 이 포트로 SSE를 띄우도록 강제
      - CONF_DEBUG=1
    networks: [opt_ai-net]
    restart: unless-stopped
    # (필요시 외부 접근용) 포트 열고 싶으면 아래 주석 해제
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    #   - "9012:9012"
    command: >
      sh -lc "
      uvicorn app.http_wrapper:api --host 0.0.0.0 --port 9001 &
      uvicorn app.bridge_mcp:app --host 0.0.0.0 --port 9012 &
      python -m app.main
      "

volumes:
  ollama: {}
  open-webui: {}
  hf-cache: {}

networks:
  opt_ai-net:
    external: true
    name: opt_ai-net